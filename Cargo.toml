[package]
name = "ppexchanger"
version = "0.7.11-beta.7"
edition = "2021"
default-run = "ppx"
description = "Fully-local, fully-encrypted LAN P2P terminal messenger (Rust)"
license = "MIT"

# The library is `ppexchanger`; the binary the user invokes is `ppx`.
[[bin]]
name = "ppx"
path = "src/main.rs"

[[bin]]
name = "ppx-relay"
path = "src/bin/ppx-relay.rs"

# External crates used by this project (kept minimal on purpose):
#   ratatui          — TUI rendering (explicitly permitted)
#   crossterm        — terminal backend (ratatui runtime)
#   x25519-dalek     — X25519 ECDH (audited)
#   chacha20poly1305 — AEAD cipher (audited)
#   sha2             — SHA-256 (used inside HKDF)
#   hkdf             — RFC 5869 HKDF-SHA256 (used in handshake + nonce derivation)
#   rand_core        — OsRng for keypair + nonce generation (already pulled in
#                      transitively by x25519-dalek 2.x; declared directly
#                      because we import from it).
#   hostname         — peer hostname in beacons (small)
#   image            — PNG decoder for clipboard-image preview (PNG-only)
#   ratatui-image    — in-terminal image preview (Kitty Graphics + halfblock
#                      fallback); picked automatically via stdio query.
# Everything else (networking, persistence, TUI plumbing) is pure std.
[dependencies]
ratatui = "0.29"
crossterm = "0.28"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
sha2 = "0.10"
hkdf = "0.12"
rand_core = "0.6"
hostname = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ratatui-image = "3.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
