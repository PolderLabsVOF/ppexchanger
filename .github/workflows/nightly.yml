name: Nightly builds

on:
  schedule:
    # A predictable UTC window keeps the rolling build easy to find and
    # avoids competing with the regular release workflow.
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: nightly ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary_name: ppx
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            binary_name: ppx
          - target: x86_64-apple-darwin
            os: macos-latest
            binary_name: ppx
          - target: aarch64-apple-darwin
            os: macos-latest
            binary_name: ppx
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary_name: ppx.exe

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      - name: Set up MSVC build environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Select MSVC linker
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $linker = where.exe link.exe |
            Where-Object { $_ -match '\\VC\\Tools\\MSVC\\' } |
            Select-Object -First 1
          if (-not $linker) { throw 'Visual Studio MSVC linker was not found on PATH' }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$($linker.Trim())" >> $env:GITHUB_ENV

      - name: Add target triple
        run: rustup target add "${{ matrix.target }}"
        shell: bash
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: nightly-${{ matrix.target }}
          cache-on-failure: true

      - name: Build nightly binary
        env:
          CARGO_TARGET_DIR: target-${{ matrix.target }}
        run: |
          cargo build --release --locked --target "${{ matrix.target }}"
          mkdir -p staging/bin
          cp "target-${{ matrix.target }}/${{ matrix.target }}/release/${{ matrix.binary_name }}" staging/bin/${{ matrix.binary_name }}
          strip "staging/bin/${{ matrix.binary_name }}" || true
          tar -C staging -czf "ppexchanger-nightly-${{ matrix.target }}.tar.gz" "bin/${{ matrix.binary_name }}"
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then
            powershell.exe -NoProfile -Command "Compress-Archive -Path 'staging/bin/ppx.exe' -DestinationPath 'ppexchanger-nightly-${{ matrix.target }}.zip' -Force"
          fi
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: ppx-nightly-${{ matrix.target }}
          path: |
            ppexchanger-nightly-*.tar.gz
            ppexchanger-nightly-*.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish rolling nightly
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: false
      - name: Create nightly checksums
        shell: bash
        run: |
          : > NIGHTLY-SHA256SUMS
          find dist -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 |
            while IFS= read -r -d '' file; do
              sha256sum "$file" | awk -v name="$(basename "$file")" '{ print $1 "  " name }'
            done | sort -k2 > NIGHTLY-SHA256SUMS
          test -s NIGHTLY-SHA256SUMS
          cat NIGHTLY-SHA256SUMS
      - name: Update rolling nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: ppexchanger nightly
          body: |
            Automated build from the latest `main` commit.

            This build is for testing the newest changes and may change every night.
            For the stable version, use the latest numbered release instead.
          prerelease: true
          make_latest: false
          files: |
            NIGHTLY-SHA256SUMS
            dist/**/*.tar.gz
            dist/**/*.zip
          fail_on_unmatched_files: false
