# Release workflow — builds the single-binary tarball + SHA256SUMS and
# publishes it to the correct release channel whenever a version tag is
# pushed. Stable `vX.Y.Z` tags must point to `main`; beta/RC
# `vX.Y.Z-beta.N` / `vX.Y.Z-rc.N` tags must point to `beta`.
# The
# install.sh lives at the repo root and is uploaded alongside the artifacts
# so the one-line `curl | bash` install always fetches the script that
# matches the binary it installs.
#
# Numbered releases are built for every supported desktop target. Linux ARM
# uses GitHub's native ARM runner, while Windows explicitly selects the MSVC
# linker so Git Bash's unrelated `link.exe` cannot be picked accidentally.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish (for example, v0.7.0)'
        required: false
        default: ''

permissions:
  contents: write   # required for GitHub release create / upload
  id-token: write   # npm trusted publishing / provenance

jobs:
  validate:
    name: validate release ref
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      channel: ${{ steps.validate.outputs.channel }}
      source_branch: ${{ steps.validate.outputs.source_branch }}
      prerelease: ${{ steps.validate.outputs.prerelease }}
      npm_tag: ${{ steps.validate.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate tag and source branch
        id: validate
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CHANNEL=stable
            SOURCE_BRANCH=main
            PRERELEASE=false
            NPM_TAG=latest
          elif [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(beta|rc)(\.[0-9A-Za-z.-]+)?$ ]]; then
            CHANNEL=beta
            SOURCE_BRANCH=beta
            PRERELEASE=true
            NPM_TAG=beta
          else
            echo "Use vX.Y.Z for stable releases or vX.Y.Z-beta.N / vX.Y.Z-rc.N for beta releases (got: $RELEASE_TAG)"
            exit 1
          fi

          git fetch origin main beta --tags --force
          RELEASE_SHA="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$RELEASE_SHA" "origin/$SOURCE_BRANCH"; then
            echo "$RELEASE_TAG must point to a commit reachable from $SOURCE_BRANCH (got $RELEASE_SHA)"
            exit 1
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "source_branch=$SOURCE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"
          echo "Validated $CHANNEL release $RELEASE_TAG from $SOURCE_BRANCH"

  build:
    name: build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary_name: ppx
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            binary_name: ppx
          - target: x86_64-apple-darwin
            os: macos-latest
            binary_name: ppx
          - target: aarch64-apple-darwin
            os: macos-latest
            binary_name: ppx
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary_name: ppx.exe
            # Windows PE binaries need link.exe (Visual Studio Build Tools),
            # which `windows-latest` ships but doesn't put on PATH. The
            # `ilammy/msvc-dev-cmd` step below activates vcvars64.bat.
            # Git Bash is used for the run steps (see `shell: bash`) so
            # `mkdir -p`, `cp`, `tar`, `sha256sum` semantics are uniform
            # across all matrix entries.
            # Keep Windows required: the job below explicitly selects the
            # Visual Studio linker instead of Git Bash's unrelated `link`
            # utility, so this target is now a supported release artifact.
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install Rust toolchain (host)
        uses: dtolnay/rust-toolchain@stable

      # Windows-only: activate MSVC so `link.exe` is on PATH. Step is a
      # no-op on Ubuntu / macOS because those runners ship a working
      # host toolchain already.
      - name: Set up MSVC build environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Git for Windows also ships a Unix `link.exe`. When the build runs
      # under Git Bash that executable can appear first on PATH, causing Rust
      # to invoke it with MSVC arguments and fail with "extra operand". Pin
      # Cargo to the linker installed by Visual Studio for this target.
      - name: Select MSVC linker
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $linker = where.exe link.exe |
            Where-Object { $_ -match '\\VC\\Tools\\MSVC\\' } |
            Select-Object -First 1
          if (-not $linker) {
            throw 'Visual Studio MSVC linker was not found on PATH'
          }
          $linker = $linker.Trim()
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" >> $env:GITHUB_ENV
          "Using MSVC linker: $linker"

      - name: Add target triple
        run: |
          # dtolnay/rust-toolchain@stable with `targets:` is unreliable for
          # non-host triples on aarch64 (the rustup call only seems to
          # register the host triple). Add it explicitly so rustc has the
          # aarch64 std library available for codegen.
          rustup target add "${{ matrix.target }}"
        shell: bash

      - name: Cache cargo registry (per-target key)
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          # Per-target prefix-key — sharing the cache across matrix entries
          # was restoring x86_64 compiled artifacts into the aarch64 build
          # dir. Each target now has its own cache namespace.
          prefix-key: ${{ matrix.target }}-v6
          cache-targets: false
          cache-workspace-crates: false

      - name: Build release binary (stripped)
        env:
          # Per-target target/ so each matrix entry has its own cache
          # space and Swatinem/rust-cache can't accidentally cross-pollinate
          # x86_64 object files into the aarch64 build.
          CARGO_TARGET_DIR: target-${{ matrix.target }}
        run: |
          cargo build --release --locked --target "${{ matrix.target }}"
          mkdir -p staging/bin
          cp "target-${{ matrix.target }}/${{ matrix.target }}/release/${{ matrix.binary_name }}" staging/bin/${{ matrix.binary_name }}
          # POSIX `strip` doesn't recognize Windows PE binaries; the
          # `|| true` swallows that silently. PE binaries ship unstripped.
          strip "staging/bin/${{ matrix.binary_name }}" || true
          ls -la staging/bin/${{ matrix.binary_name }}
        shell: bash

      - name: Compose tarball + checksums
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          TARGET: ${{ matrix.target }}
          BINARY_NAME: ${{ matrix.binary_name }}
        run: |
          TAG_BARE="${RELEASE_TAG#v}"
          ASSET="ppexchanger-${TAG_BARE}-${TARGET}.tar.gz"
          # POSIX tar works on Windows under Git Bash.
          tar -C staging -czf "${ASSET}" "bin/${BINARY_NAME}"
          # SHA256SUMS covers the tarball + the install script so the
          # installer's checksum check matches what's published.
          sha256sum "${ASSET}" install.sh > SHA256SUMS
          # Windows: also produce a .zip for users who download manually
          # without going through the bash installer (double-click
          # download from a browser). PowerShell's Compress-Archive is
          # built into Windows 10+ / Server 2019+, no extra tooling.
          if [ "${TARGET}" = "x86_64-pc-windows-msvc" ]; then
            ZIP_ASSET="ppexchanger-${TAG_BARE}-${TARGET}.zip"
            powershell.exe -NoProfile -Command "Compress-Archive -Path 'staging/bin/ppx.exe' -DestinationPath '${ZIP_ASSET}' -Force"
            sha256sum "${ZIP_ASSET}" >> SHA256SUMS
          fi
          cat SHA256SUMS
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ppx-${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
            SHA256SUMS
          if-no-files-found: error

  publish:
    name: publish release
    # Publish npm first so a missing/invalid npm credential cannot leave a
    # GitHub release that users cannot install through npm.
    needs: [validate, build, publish-npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: false   # keep each target in its own subdir

      - name: Compose single SHA256SUMS across all targets
        run: |
          # Each matrix job wrote its own SHA256SUMS containing one
          # tarball + (on Windows) one zip + the install.sh entry.
          # Concatenate, then dedupe by filename (the install.sh line
          # repeats once per target but it hashes identically so sort -u
          # collapses it).
          cat dist/*/SHA256SUMS | sort -u -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Create / update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: ppexchanger ${{ needs.validate.outputs.tag }}
          body: |
            Built from the `${{ needs.validate.outputs.source_branch }}` branch.

            ${{ needs.validate.outputs.channel == 'beta' && 'This beta build is for testing upcoming changes. It may change before the next stable release.' || 'This stable release is ready for everyday use.' }}
          generate_release_notes: true
          files: |
            SHA256SUMS
            install.sh
            dist/**/*.tar.gz
            dist/**/*.zip
          # Some targets may be unavailable on a given runner (for example,
          # Windows zip creation). Upload every artifact that was produced
          # instead of failing the entire release because an optional pattern
          # has no matches.
          fail_on_unmatched_files: false
          draft: false
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.validate.outputs.prerelease != 'true' }}

  publish-npm:
    name: publish npm package
    needs: [validate, build]
    runs-on: ubuntu-latest
    environment:
      name: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
      # npm trusted publishing requires npm 11.5.1+ and Node 22.14+.
      # Pin a current Node release and npm CLI so OIDC auth works reliably
      # on GitHub's rotating runner images.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Ensure trusted-publishing capable npm
        run: |
          npm install --global npm@11.5.1
          npm --version
      - name: Publish package with provenance
        working-directory: npm/ppx
        env:
          NPM_TAG: ${{ needs.validate.outputs.npm_tag }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_VERSION="${RELEASE_TAG#v}"
          if [[ "$PACKAGE_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "npm package version $PACKAGE_VERSION does not match release tag $RELEASE_TAG"
            exit 1
          fi
          # npm trusted publishing uses the GitHub OIDC token automatically.
          # No long-lived npm token is required.
          npm publish --access public --provenance --tag "$NPM_TAG"
